<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sahasra AI Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0a5e1f;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    background: #f1f5f9;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #8B008B, #1e293b);
    color: white;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
  }

  .header-info { flex: 1; }
  .header-info h1 { font-size: 15.5px; font-weight: 600; }
  .header-info p { font-size: 12px; opacity: 0.65; margin-top: 1px; }

  .badge {
    font-size: 10px;
    background: #22c55e;
    color: white;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 600;
  }
  .badge.premium { background: #f59e0b; }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message {
    max-width: 82%;
    padding: 11px 13px;
    border-radius: 14px;
    font-size: 14.2px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .bot {
    background: white;
    border: 1px solid #e2e8f0;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  .user {
    background: #2563eb;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .time {
    font-size: 10px;
    opacity: 0.55;
    margin-top: 5px;
    display: block;
  }

  .suggestions {
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: #e2e8f0;
  }

  .suggestions button {
    background: white;
    border: 1px solid #cbd5e1;
    color: #1e293b;
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12.5px;
    cursor: pointer;
  }

  .suggestions button:hover {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
  }

  .input-area {
    padding: 12px 14px;
    background: white;
    border-top: 1px solid #e2e8f0;
    display: flex;
    gap: 10px;
  }

  .input-area input {
    flex: 1;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    outline: none;
  }

  .input-area input:focus { border-color: #2563eb; }

  .input-area button {
    background: #2563eb;
    color: white;
    border: none;
    width: 46px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">AI</div>
      <div class="header-info">
        <h1>Sahasra AI Assistant</h1>
        <p id="status">General Mode</p>
      </div>
      <div class="badge" id="modeBadge">Normal</div>
    </div>

    <div class="chat" id="chat"></div>
    <div class="suggestions" id="suggestions"></div>

    <div class="input-area">
      <input id="msg" type="text" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')handleSend()" />
      <button onclick="handleSend()">→</button>
    </div>
  </div>

<script>

const chatEl = document.getElementById('chat');
const suggestionsEl = document.getElementById('suggestions');
const statusEl = document.getElementById('status');
const modeBadge = document.getElementById('modeBadge');
const input = document.getElementById('msg');

let state = {
  mode: 'normal',
  activationCode: null,
  waitingForCode: false,
  history: []
};

const API_URL = "http://127.0.0.1:8000/ask";   // your FastAPI

function now() {
  const d = new Date();
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m < 10 ? '0' + m : m} ${ap}`;
}

function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = `message ${type}`;

  // Simple markdown rendering
  let formatted = text
    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')          // **bold**
    .replace(/\*(.*?)\*/g, '<i>$1</i>')              // *italic*
    .replace(/\n/g, '<br>')                         // new lines
    .replace(/• /g, '• ')                           // keep bullets
    .replace(/👤/g, '👤 ')
    .replace(/🏥/g, '🏥 ')
    .replace(/👨‍⚕️/g, '👨‍⚕️ ')
    .replace(/🩺/g, '🩺 ');

  div.innerHTML = `${formatted}<span class="time">${now()}</span>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showSuggestions(list) {
  suggestionsEl.innerHTML = '';
  list.forEach(item => {
    const btn = document.createElement('button');
    btn.textContent = item.label;
    btn.onclick = () => {
      input.value = item.send;
      handleSend();
    };
    suggestionsEl.appendChild(btn);
  });
}

function start() {
  chatEl.innerHTML = '';
  state = { mode: 'normal', activationCode: null, waitingForCode: false, history: [] };
  statusEl.textContent = 'General Mode';
  modeBadge.textContent = 'Normal';
  modeBadge.classList.remove('premium');

  addMessage(
    `Hello! 👋<br><br>I'm <b>Sahasra AI Assistant</b>.<br><br>You can ask me general questions about hospitals, doctors, specialties, etc.`,
    'bot'
  );

  showSuggestions([
    { label: 'Doctors at Apollo Kukatpally', send: 'What doctors work at Apollo Kukatpally?' },
    { label: 'Enter Activation Code', send: 'Enter activation code' }
  ]);
}

function handleSend() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  input.value = '';
  processMessage(text);
}

async function processMessage(text) {
  const q = text.toLowerCase();

  // User wants to enter code
  if (q.includes('enter activation code') || q.includes('activation code')) {
    state.waitingForCode = true;
    addMessage(`Please type your activation code.`, 'bot');
    showSuggestions([]);
    return;
  }

  // Waiting for code
  if (state.waitingForCode) {
    if (text.toUpperCase().startsWith('ATH-')) {
      state.mode = 'premium';
      state.activationCode = text.toUpperCase();
      state.waitingForCode = false;

      statusEl.textContent = 'Premium Connected';
      modeBadge.textContent = 'Premium';
      modeBadge.classList.add('premium');

      addMessage(`✅ Premium activated.<br><br>You now have access to your hospital’s live data.`, 'bot');

      showSuggestions([
        { label: 'Show all patients', send: 'Show me all patients' },
        { label: 'Current admissions', send: 'Show current admissions' },
        { label: 'Oldest patient', send: 'Who is the oldest patient?' }
      ]);
    } else {
      addMessage(`Invalid code. Please try again.`, 'bot');
    }
    return;
  }

  // Call the real backend
  await callBackend(text);
}

async function callBackend(question) {
  statusEl.textContent = 'Thinking...';

  // Add user message to history
  state.history.push({ role: 'user', content: question });

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        question: question,
        activation_code: state.activationCode,
        chat_history: state.history
      })
    });

    const data = await response.json();

    if (data.status === 'success') {
      addMessage(data.answer, 'bot');
      state.history.push({ role: 'assistant', content: data.answer });
    } else {
      addMessage('Sorry, something went wrong.', 'bot');
    }

  } catch (error) {
    addMessage('Could not connect to the AI server. Make sure the backend is running.', 'bot');
    console.error(error);
  }

  // Restore status
  if (state.mode === 'premium') {
    statusEl.textContent = 'Premium Connected';
  } else {
    statusEl.textContent = 'General Mode';
  }

  // Show suggestions again
  if (state.mode === 'premium') {
    showSuggestions([
      { label: 'Show all patients', send: 'Show me all patients' },
      { label: 'Current admissions', send: 'Show current admissions' },
      { label: 'Oldest patient', send: 'Who is the oldest patient?' }
    ]);
  } else {
    showSuggestions([
      { label: 'Doctors at Apollo Kukatpally', send: 'What doctors work at Apollo Kukatpally?' },
      { label: 'Enter Activation Code', send: 'Enter activation code' }
    ]);
  }
}

start();
</script>
</body>
</html>
