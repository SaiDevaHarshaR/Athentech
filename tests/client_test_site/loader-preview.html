<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Official Sahasra Loader Preview</title><style>body{margin:0;background:linear-gradient(140deg,#f5f9ff,#eef2fc);font:14px system-ui;color:#324761}.wrap{padding:24px}.demo{margin-top:18px;background:#fff;border:1px solid #e2e9f3;border-radius:13px;padding:16px}.hint{font-size:12px;color:#617791}#error{color:#a02828}</style></head><body><div class="wrap"><strong>Client website simulator</strong><p class="hint">The official Sahasra loader should show a floating chat button in the bottom-right corner. Click it to open B2B login.</p><div class="demo">Corporate portal content<br><span class="hint">Your B2B assistant appears over this page.</span></div><p id="error"></p></div><script>
(()=>{'use strict';try{const qs=new URLSearchParams(location.search);const loader=new URL(qs.get('loader')||'');const client=qs.get('client')||'';const site=qs.get('site')||'';if(loader.protocol!=='https:'||loader.pathname.split('/').pop()!=='widget-loader.js'||!/^[A-Za-z0-9_-]{1,50}$/.test(client))throw Error('Invalid loader configuration');window.SahasraChat={label:'white',client,mode:'b2b',site:site||location.origin};const script=document.createElement('script');script.src=loader.href;script.onerror=()=>{document.getElementById('error').textContent='Could not load widget-loader.js. Check network and origin.'};document.body.appendChild(script);}catch(e){document.getElementById('error').textContent=e.message}})();
</script></body></html>
